stages:
  data_ingestion:
    cmd: python -m src.data.data_ingestion
    deps:
      - src/data/data_ingestion.py
      - reddit.csv
    params:
      - data_ingestion.test_size
      - data_ingestion.random_state
    outs:
      - data/raw:
          cache: false

  data_preprocessing:
    cmd: python -m src.data.data_preprocessing
    deps:
      - data/raw/train.csv
      - data/raw/test.csv
      - src/data/data_preprocessing.py
      - src/preprocessing.py
    outs:
      - data/preprocessed:
          cache: false

  model_building:
    cmd: python -m src.model.model_building
    deps:
      - data/preprocessed/train_processed.csv
      - src/model/model_building.py
    params:
      - model_building.max_features
      - model_building.ngram_range
      - model_building.learning_rate
      - model_building.max_depth
      - model_building.n_estimators
    outs:
      - models/trained_model/lgbm_model.pkl:
          cache: false
      - models/vectorizer_model/tfidf_vectorizer.pkl:
          cache: false

  model_evaluation:
    cmd: python -m src.model.model_evaluation
    deps:
      - models/trained_model/lgbm_model.pkl
      - models/vectorizer_model/tfidf_vectorizer.pkl
      - data/preprocessed/train_processed.csv
      - data/preprocessed/test_processed.csv
      - src/model/model_evaluation.py
    outs:
      - data/evaluation

  model_registration:
    cmd: python -m src.model.register_model
    deps:
      - data/evaluation/experiment_info.json
      - src/model/register_model.py
